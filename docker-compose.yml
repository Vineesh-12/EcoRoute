version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: ecoroute_postgis
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: mswm_routing
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecoroute_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/mswm_routing
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecoroute_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
